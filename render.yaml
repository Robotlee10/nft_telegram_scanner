services:
  - type: background
    name: nft-agentic-worker
    env: docker
    region: ohio # Change to your preferred region (e.g., frankfurt, oregon)
    plan: free # Or select a paid instance plan if needed
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MY_AGENTIC_WALLET
        sync: false
      - key: BSC_HTTP_URL
        value: https://bsc-dataseed1.binance.org/
